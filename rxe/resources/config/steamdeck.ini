# Steam Deck (LCD, 1280x800): the measured base every other tier derives from.
# 60 fps budget, measured on the Deck with apps/shell/scenes city / streamworld /
# gallery: 14.3 / 5.2 / 12.4 ms (p99 15.0 / 6.5 / 13.5). FSR3 performance with
# sharpening; RT shadows (cheaper than cascades in interiors), SSAO not RTAO;
# DDGI (+6-7 ms), clouds (+2.5 ms), froxel fog and motion blur do not fit.

[render.antialiasing]
aa_mode = upscaler
upscaler = fsr3
upscaler_quality = performance
sharpness = 0.4
taa_history_blend = 0.9

[render.shadows]
rt_shadows = true
sun_angular_radius = 0.0043633
shadow_maps = false
shadow_resolution = 1024
shadow_distance = 100.0

[render.geometry]
gpu_culling = true
gpu_occlusion = true
distance_lod = true
mesh_shader_lod = false
vsync = true

[render.sky]
sky = true
ibl = true
ibl_intensity = 1.0
aerial_perspective = 1.0
clouds = false
cloud_coverage = 0.46

[render.ambient_occlusion]
rtao = false
ssao = true
ao_radius = 1.2
ao_intensity = 1.0
ao_rays = 1

[render.global_illumination]
ddgi = false
ddgi_spacing = 2.5
ddgi_intensity = 1.0
ssgi = false
rcgi = false

[render.reflections]
rt_reflections = false
reflection_roughness_cutoff = 0.4
water_reflections = false
ssr = true
water_triangle_budget = 4096

[render.characters]
human_tier_cap = standard

[render.path_tracing]
path_trace = false
path_trace_reference = false
path_trace_spp = 2
path_trace_accum = 16
path_trace_recon = false
path_trace_recon_weight = 0.05
path_trace_recon_atrous = 4

[render.fog]
fog = false
fog_density = 0.03
fog_height_falloff = 0.15
fog_base_height = 0.0
fog_anisotropy = 0.6
froxel_fog = false

[render.post]
bloom = true
bloom_intensity = 0.04
motion_blur = false
sss = true
auto_exposure = true
adaptation_speed = 3.0
exposure = 1.0

# The Deck's memory plan: 16 GB shared between cpu and gpu, so smaller budgets
# than a desktop (whose plan is the built-in default).
[memory.arena]
frame_mb = 6

[memory.pools]
ecs_chunks = 192

[memory.budgets]
assets = 1024
render = 384
ecs = 96
audio = 48
