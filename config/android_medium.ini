# Mid-range mobile, and any mobile gpu the detection does not recognize: TAA at
# 60% resolution instead of FSR3 (whose fixed cost is ~2.8 ms), no SSAO or SSS.
# Budget ~6 ms on a Deck; measured 9.9 / 1.5 / 14.3 ms (content-bound).

include = rxe://config/android_high.ini

[render.antialiasing]
aa_mode = taa
upscaler = none

[render.resolution]
render_scale = 0.6

[render.ambient_occlusion]
ssao = false

[render.post]
sss = false
