# Flagship mobile (Adreno 730+, Immortalis, Xclipse): Deck minus ray tracing and
# SSR. Budget ~10 ms on a Deck (thermally ~0.6x one); measured 11.6 / 4.8 / 12.5
# ms. The showcase scenes are desktop content: their shading cost barely
# moves with resolution, so mobile content has to be scaled down as well.

include = rxe://config/steamdeck.ini

[render.shadows]
rt_shadows = false
shadow_maps = true

[render.reflections]
ssr = false

# Mobile memory plan, for every android tier.
[memory.arena]
frame_mb = 4

[memory.pools]
ecs_chunks = 128

[memory.budgets]
assets = 512
render = 256
ecs = 64
audio = 32
