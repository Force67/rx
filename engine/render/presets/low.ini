# Weak or old desktop gpus without ray tracing (GTX 1660 class, ~3x a Deck) at
# 1080p: the Deck tier with cascaded shadows and FSR3 balanced. Estimated from
# the Deck: 15.5 / 5.4 / 18.2 ms there against a ~24 ms equivalent budget.

include = steamdeck

[antialiasing]
upscaler_quality = balanced
sharpness = 0.3

[shadows]
rt_shadows = false
shadow_maps = true
shadow_resolution = 2048
shadow_distance = 140.0

[geometry]
vsync = false
