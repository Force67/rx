# High-end desktop (RTX 4070 Ti / 3080 Ti) at 1440p: the full feature set, radiance
# cached GI, reconstructed from DLSS/FSR quality. Measured on a 3080 Ti at
# 1440p: 9.2 / 6.7 ms (city / gallery).

include = medium

[antialiasing]
sharpness = 0.0

[shadows]
sun_angular_radius = 0.0087266
shadow_resolution = 4096
shadow_distance = 280.0

[ambient_occlusion]
ao_rays = 6

[global_illumination]
ddgi_spacing = 1.0
rcgi = true

[reflections]
reflection_roughness_cutoff = 0.85
water_triangle_budget = 32768

[characters]
human_tier_cap = hero

[path_tracing]
path_trace_spp = 4
