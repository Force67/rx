# PS5 / Series X (~0.5x an RTX 3080 Ti) at 4K output: medium's features with FSR3
# performance and vsync. Estimated from medium's 3080 Ti measurement.

include = medium

[antialiasing]
upscaler = fsr3
upscaler_quality = performance
sharpness = 0.25

[shadows]
sun_angular_radius = 0.0087266
shadow_distance = 180.0

[geometry]
vsync = true

[ambient_occlusion]
ao_rays = 3

[reflections]
reflection_roughness_cutoff = 0.5

[characters]
human_tier_cap = hero

[fog]
fog_density = 0.02
