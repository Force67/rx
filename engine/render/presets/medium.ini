# Mid-range RT desktop (RTX 3060 / RX 6600 XT, ~0.45x an RTX 3080 Ti) at 1440p.
# Measured on a 3080 Ti at 1440p: 6.6 / 6.0 ms (city / gallery) against a ~7.5 ms
# equivalent budget; the 3060 figure is an estimate.

include = low

[antialiasing]
upscaler = dlss
upscaler_quality = quality
sharpness = 0.2

[shadows]
rt_shadows = true
sun_angular_radius = 0.0069813
shadow_maps = false
shadow_distance = 160.0

[geometry]
distance_lod = false

[sky]
clouds = true

[ambient_occlusion]
rtao = true
ao_rays = 2

[global_illumination]
ddgi = true
ddgi_spacing = 1.5
ssgi = true

[reflections]
rt_reflections = true
water_reflections = true
water_triangle_budget = 8192
