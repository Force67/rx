# Old or entry-level mobile: half resolution, small short shadows, no bloom or
# haze. Budget ~3.5 ms on a Deck; measured 7.1 / 1.0 / 8.3 ms (content-bound).

include = android_medium

[resolution]
render_scale = 0.5

[shadows]
shadow_resolution = 512
shadow_distance = 60.0

[sky]
aerial_perspective = 0.0

[characters]
human_tier_cap = distant

[post]
bloom = false
